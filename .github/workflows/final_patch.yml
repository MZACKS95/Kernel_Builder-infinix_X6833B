name: Build MT7601u-patched_final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mt7601u:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential \
            ccache curl flex git \
            libelf-dev libssl-dev \
            lz4 pahole python3 rsync

      - name: Cache Google Kernel Source
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: android/kernel/common/7c6bbcca33e1
          key: gki-source-7c6bbcca33e1-v3

      - name: Checkout Google Kernel Source
        run: |
          set -e
          KERNEL_DIR="$GITHUB_WORKSPACE/android/kernel/common/7c6bbcca33e1"
          mkdir -p "$(dirname "$KERNEL_DIR")"
          if [ "${{ steps.kernel-cache.outputs.cache-hit }}" != "true" ]; then
            echo "===== CACHE MISS - CLONE FRESH ====="
            git clone https://android.googlesource.com/kernel/common "$KERNEL_DIR"
          else
            echo "===== CACHE HIT - RESTORE FROM CACHE ====="
          fi
          cd "$KERNEL_DIR"
          git checkout --detach 7c6bbcca33e1
          git reset --hard HEAD
          git clean -fd
          echo "===== VERIFY SOURCE COMMIT ====="
          git log -1 --oneline
          ACTUAL=$(git rev-parse HEAD)
          if [ "${ACTUAL:0:12}" != "7c6bbcca33e1" ]; then
            echo "ERROR: Kernel commit mismatch"
            exit 1
          fi
          echo "===== VERIFY GKI_DEFCONFIG ====="
          ls -lh arch/arm64/configs/gki_defconfig || echo "WARNING: gki_defconfig tidak ada, akan pakai fallback defconfig"
          ls arch/arm64/configs/ | head -n 50

      - name: Check + Apply NetHunter Injection Patch
        run: |
          set -e
          KERNEL_DIR="$GITHUB_WORKSPACE/android/kernel/common/7c6bbcca33e1"
          PATCH="$GITHUB_WORKSPACE/.github/workflows/add-wifi-injection-5.10.patch"
          cd "$KERNEL_DIR"
          echo "===== CHECK PATCH ====="
          git apply --check --verbose "$PATCH"
          echo "===== CHECK LOLOS, APPLY BENERAN ====="
          git apply --verbose "$PATCH"
          echo "===== FILE YANG KE-PATCH ====="
          git diff --stat
          git diff --name-only

      - name: Cache AOSP Clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang-aosp
          key: aosp-clang-r416183b-android12

      - name: Download AOSP Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p clang-aosp
          curl -L --fail --retry 3 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"
          tar -xzf clang.tar.gz -C clang-aosp
          rm clang.tar.gz

      - name: Setup AOSP Clang PATH
        run: |
          set -e
          echo "$GITHUB_WORKSPACE/clang-aosp/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/clang-aosp/bin:$PATH"
          command -v clang
          clang --version
          command -v ld.lld
          ld.lld --version

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mt7601u-5.10.209-7c6bbcca33e1
          restore-keys: |
            mt7601u-5.10.209-7c6bbcca33e1
          max-size: 2G

      - name: Download Original 248 Symbols
        run: |
          set -e
          curl -L --fail --retry 3 \
            -o Module.symvers.final \
            "https://raw.githubusercontent.com/MZACKS95/Firmware-5.10.209/main/config/Module.symvers.final"
          test "$(wc -l < Module.symvers.final)" -eq 248
          awk '
            NF != 4 {
              print "ERROR: Invalid format at line", NR, $0
              bad=1
            }
            END {
              exit bad
            }
          ' Module.symvers.final

      - name: Prepare Kernel Headers
        run: |
          set -e
          KERNEL_DIR="$GITHUB_WORKSPACE/android/kernel/common/7c6bbcca33e1"
          cd "$KERNEL_DIR"
          export ARCH=arm64
          export SUBARCH=arm64
          JOBS=2
          if [ -f "arch/arm64/configs/gki_defconfig" ]; then
            echo "USING gki_defconfig"
            make -j"$JOBS" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          else
            echo "GKI NOT FOUND, FALLBACK TO defconfig"
            make -j"$JOBS" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- defconfig
          fi
          ./scripts/config --file out/.config \
            --enable CONFIG_MODULES \
            --enable CONFIG_MODVERSIONS \
            --enable CONFIG_USB \
            --enable CONFIG_WIRELESS \
            --enable CONFIG_WLAN \
            --enable CONFIG_WLAN_VENDOR_MEDIATEK \
            --module CONFIG_CFG80211 \
            --module CONFIG_MAC80211 \
            --module CONFIG_MT7601U
          ./scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION \
            "-android12-9-00016-g7c6bbcca33e1-ab12029497"
          ./scripts/config --file out/.config \
            --disable CONFIG_LOCALVERSION_AUTO
          make -j"$JOBS" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E 'CONFIG_MODULES=|CONFIG_MODVERSIONS=|CONFIG_USB=|CONFIG_WIRELESS=|CONFIG_WLAN=|CONFIG_WLAN_VENDOR_MEDIATEK=|CONFIG_CFG80211=|CONFIG_MAC80211=|CONFIG_MT7601U=' out/.config
          grep -q '^CONFIG_WLAN_VENDOR_MEDIATEK=y$' out/.config
          grep -q '^CONFIG_MT7601U=m$' out/.config
          make -j"$JOBS" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          KERNEL_RELEASE=$(cat out/include/config/kernel.release)
          EXPECTED="5.10.209-android12-9-00016-g7c6bbcca33e1-ab12029497"
          echo "Expected: $EXPECTED"
          echo "Actual:   $KERNEL_RELEASE"
          KERNEL_RELEASE_CLEAN="${KERNEL_RELEASE%+}"
          echo "Cleaned:  $KERNEL_RELEASE_CLEAN"
          if [ "$KERNEL_RELEASE_CLEAN" != "$EXPECTED" ]; then
          echo "ERROR: Kernel release mismatch"
          exit 1
          fi

      - name: Install Original 248 Symbol CRCs
        run: |
          set -e
          KERNEL_DIR="$GITHUB_WORKSPACE/android/kernel/common/7c6bbcca33e1"
          awk '
            NF == 4 {
              printf "%s\t%s\t%s\t%s\t\n", $1, $2, $3, $4
              next
            }
            {
              print "ERROR: Invalid input at line", NR
              exit 1
            }
          ' Module.symvers.final > Module.symvers.fixed
          awk -F '\t' '
            NF != 5 {
              print "ERROR:", NR, "columns:", NF
              bad=1
            }
            END {
              exit bad
            }
          ' Module.symvers.fixed
          test "$(wc -l < Module.symvers.fixed)" -eq 248
          cp Module.symvers.fixed "$KERNEL_DIR/out/Module.symvers"
          wc -l "$KERNEL_DIR/out/Module.symvers"
          head -n 5 "$KERNEL_DIR/out/Module.symvers"

      - name: Verify MT7601U Source
        run: |
          set -e
          DRIVER_DIR="$GITHUB_WORKSPACE/android/kernel/common/7c6bbcca33e1/drivers/net/wireless/mediatek/mt7601u"
          test -d "$DRIVER_DIR"
          test -f "$DRIVER_DIR/Makefile"
          test -f "$DRIVER_DIR/Kconfig"
          cat "$DRIVER_DIR/Makefile"
          ls -lh "$DRIVER_DIR"

      - name: Build CFG80211 and MAC80211
        run: |
          set -e
          KERNEL_DIR="$GITHUB_WORKSPACE/android/kernel/common/7c6bbcca33e1"
          cd "$KERNEL_DIR"
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang-aosp/bin:$PATH"
          export CC="ccache clang"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          echo "===== BUILD cfg80211 - PATCHED ====="
          make -j2 O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_MODPOST_WARN=1 \
            M=net/wireless modules
          echo "===== BUILD mac80211 - PATCHED ====="
          make -j2 O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_MODPOST_WARN=1 \
            M=net/mac80211 modules
          echo "===== CARI HASILNYA ====="
          ls -lh out/net/wireless/cfg80211.ko
          ls -lh out/net/mac80211/mac80211.ko
          cp out/net/wireless/cfg80211.ko "$GITHUB_WORKSPACE/artifacts/cfg80211.ko"
          cp out/net/mac80211/mac80211.ko "$GITHUB_WORKSPACE/artifacts/mac80211.ko"
          ls -lh "$GITHUB_WORKSPACE/artifacts/"
          echo "===== RESTORE 248 SYMBOLS BUAT MT7601U ====="
          cp "$GITHUB_WORKSPACE/Module.symvers.fixed" "$KERNEL_DIR/out/Module.symvers"
          wc -l "$KERNEL_DIR/out/Module.symvers"
          echo "RESTORED OK"

      - name: Build MT7601U Only
        run: |
          set -e
          KERNEL_DIR="$GITHUB_WORKSPACE/android/kernel/common/7c6bbcca33e1"
          DRIVER_DIR="$KERNEL_DIR/drivers/net/wireless/mediatek/mt7601u"
          cd "$KERNEL_DIR"
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang-aosp/bin:$PATH"
          export CC="ccache clang"
          make -j2 O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KBUILD_MODPOST_WARN=1 M="$DRIVER_DIR" modules
          KO=$(find "$DRIVER_DIR" "$KERNEL_DIR/out" -type f -name 'mt7601u.ko' -print -quit)
          if [ -z "$KO" ]; then
            echo "ERROR: mt7601u.ko was not generated"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$KO" "$GITHUB_WORKSPACE/artifacts/mt7601u.ko"
          ls -lh "$GITHUB_WORKSPACE/artifacts/mt7601u.ko"
          file "$GITHUB_WORKSPACE/artifacts/mt7601u.ko"
          llvm-nm -u "$GITHUB_WORKSPACE/artifacts/mt7601u.ko" > "$GITHUB_WORKSPACE/artifacts/undefined-symbols.txt" || true
          cat "$GITHUB_WORKSPACE/artifacts/undefined-symbols.txt"

      - name: Upload MT7601U KO
        uses: actions/upload-artifact@v4
        with:
          name: MT7601U-KO-5.10.209
          path: |
            artifacts/mt7601u.ko
            artifacts/cfg80211.ko
            artifacts/mac80211.ko
            artifacts/undefined-symbols.txt
          if-no-files-found: error
          retention-days: 14
